name: Android Release Builds

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: android
            api: "21"
            cc: aarch64-linux-android21-clang
            cxx: aarch64-linux-android21-clang++
            ar: llvm-ar
            ranlib: llvm-ranlib

          - target: armv7-linux-androideabi
            os: android
            api: "21"
            cc: armv7a-linux-androideabi21-clang
            cxx: armv7a-linux-androideabi21-clang++
            ar: llvm-ar
            ranlib: llvm-ranlib

          - target: aarch64-unknown-linux-musl
            os: linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Android NDK
        if: matrix.os == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install aarch64-musl cross toolchain
        if: matrix.os == 'linux-musl'
        run: |
          curl -L https://musl.cc/aarch64-linux-musl-cross.tgz | tar xz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Configure Android toolchain
        if: matrix.os == 'android'
        shell: bash
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          case "${{ matrix.target }}" in
            aarch64-linux-android)
              echo "CC_aarch64_linux_android=$TOOLCHAIN/${{ matrix.cc }}" >> $GITHUB_ENV
              echo "CXX_aarch64_linux_android=$TOOLCHAIN/${{ matrix.cxx }}" >> $GITHUB_ENV
              echo "AR_aarch64_linux_android=$TOOLCHAIN/${{ matrix.ar }}" >> $GITHUB_ENV
              echo "RANLIB_aarch64_linux_android=$TOOLCHAIN/${{ matrix.ranlib }}" >> $GITHUB_ENV
              echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/${{ matrix.cc }}" >> $GITHUB_ENV
              ;;
            armv7-linux-androideabi)
              echo "CC_armv7_linux_androideabi=$TOOLCHAIN/${{ matrix.cc }}" >> $GITHUB_ENV
              echo "CXX_armv7_linux_androideabi=$TOOLCHAIN/${{ matrix.cxx }}" >> $GITHUB_ENV
              echo "AR_armv7_linux_androideabi=$TOOLCHAIN/${{ matrix.ar }}" >> $GITHUB_ENV
              echo "RANLIB_armv7_linux_androideabi=$TOOLCHAIN/${{ matrix.ranlib }}" >> $GITHUB_ENV
              echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$TOOLCHAIN/${{ matrix.cc }}" >> $GITHUB_ENV
              ;;
          esac

      - name: Configure musl toolchain
        if: matrix.os == 'linux-musl'
        shell: bash
        run: |
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_musl=aarch64-linux-musl-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> $GITHUB_ENV

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pumpkin \
             dist/pumpkin-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-${{ matrix.target }}
          path: dist/pumpkin-${{ matrix.target }}
          compression-level: 9
